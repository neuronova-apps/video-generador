name: Validación audiovisual compositor 8.0
on:
  push:
    branches: [develop]
    paths:
      - 'scripts/build-storyboard-composition.mjs'
      - 'scripts/visual-compositor-v8.mjs'
      - 'tests/visual-compositor-v8.test.mjs'
      - 'examples/storyboard-piloto/**'
      - '.github/workflows/storyboard-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/build-storyboard-composition.mjs examples/storyboard-piloto/storyboard.json examples/storyboard-piloto/render
      - name: Verificar compositor visual 8.0
        run: |
          grep -q 'browser-shell' examples/storyboard-piloto/render/index.html || { echo 'Sin estructura visual del compositor'; exit 1; }
          grep -q 'feature-visual' examples/storyboard-piloto/render/index.html || { echo 'Sin composiciones gráficas diferenciadas'; exit 1; }
      - name: Validación HyperFrames
        working-directory: examples/storyboard-piloto/render
        run: ../../../node_modules/.bin/hyperframes lint
      - name: Render MP4
        working-directory: examples/storyboard-piloto/render
        run: ../../../node_modules/.bin/hyperframes render
      - name: Verificar video
        run: |
          F=$(find examples/storyboard-piloto/render -type f -name '*.mp4' | head -n 1)
          test -n "$F"
          node - "$F" <<'NODE'
          const {spawnSync}=require('node:child_process');
          const f=process.argv[2];
          const p=spawnSync('ffprobe',['-v','error','-show_entries','format=duration:stream=codec_type,width,height','-of','json',f],{encoding:'utf8'});
          if(p.status!==0)process.exit(1);
          const v=JSON.parse(p.stdout),track=v.streams.find(x=>x.codec_type==='video');
          if(!track||track.width!==1280||track.height!==720||Math.abs(Number(v.format.duration)-10)>.5)process.exit(1);
          console.log('MP4 conforme:',v.format.duration,'s');
          NODE
      - name: Verificar ausencia de escenas negras
        run: |
          F=$(find examples/storyboard-piloto/render -type f -name '*.mp4' | head -n 1)
          ffmpeg -hide_banner -i "$F" -vf "blackdetect=d=0.5:pix_th=0.10:pic_th=0.98" -an -f null - 2> blackdetect.log
          if grep -q "black_start:" blackdetect.log; then
            cat blackdetect.log
            echo "ERROR: se detectó una escena negra sostenida"
            exit 1
          fi
      - name: Generar imágenes de inspección visual
        run: |
          F=$(find examples/storyboard-piloto/render -type f -name '*.mp4' | head -n 1)
          mkdir -p output/revision-visual
          ffmpeg -hide_banner -loglevel error -ss 2 -i "$F" -frames:v 1 -y output/revision-visual/escena-1.jpg
          ffmpeg -hide_banner -loglevel error -ss 7 -i "$F" -frames:v 1 -y output/revision-visual/escena-2.jpg
          test -s output/revision-visual/escena-1.jpg
          test -s output/revision-visual/escena-2.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: inspeccion-visual-compositor-8
          path: output/revision-visual/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: piloto-storyboard-7-5
          path: examples/storyboard-piloto/render/**/*.mp4
          if-no-files-found: error
